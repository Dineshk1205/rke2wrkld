apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: ai-prod-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.16.40.50-172.16.40.69
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ai-prod-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - ai-prod-pool
